[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dontdial"
version = "0.1.0"
description = "Your AI gave you a support number. Don't dial it yet. Verify contacts from AI answers against official sources."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "phonenumbers>=8.13",
]
authors = [{ name = "X0D4N" }]

[project.scripts]
dontdial = "dontdial.cli:main"

[project.urls]
Homepage = "https://github.com/CYPHERLYNX/dontdial"

[tool.setuptools.packages.find]
where = ["."]
include = ["dontdial*"]
