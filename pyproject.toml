[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "driftcanary"
version = "0.1.0"
description = "Behavioral-drift canary for AI systems: probe on a schedule, baseline against your own history, alert on drift."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
authors = [{ name = "CYPHERLYNX" }]

[project.scripts]
driftcanary = "driftcanary.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["driftcanary*"]
