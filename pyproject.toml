[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siteseal"
version = "0.1.0"
description = "Security-posture auditor for deployed ChatGPT Sites: header grading, client-JS secret scan, unauthenticated storage probes, injection seams, sign-in surface. Dependency-free."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
authors = [{ name = "X0D4N" }]

[project.scripts]
siteseal = "siteseal.cli:main"

[project.urls]
Homepage = "https://github.com/CYPHERLYNX/siteseal"

[tool.setuptools.packages.find]
where = ["."]
include = ["siteseal*"]
